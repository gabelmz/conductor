name: Release Conductor

on:
  push:
    tags:
      - "v*"
      - "latest"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable backend Python environment
        # A plain `venv` is not portable — its python.exe needs the exact
        # base-interpreter path it was created from to exist on whatever
        # machine runs it. On this runner that path is an ephemeral
        # per-job toolcache directory that is gone once this job ends, so a
        # venv built here could never have worked for anyone downloading the
        # release. scripts/build-portable-python.mjs bundles Python's
        # official self-contained embeddable distribution instead.
        run: node scripts/build-portable-python.mjs .venv-portable

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Ensure GitHub release exists
        # electron-builder's own "create the release if it doesn't exist yet"
        # check races itself when it uploads multiple artifacts (exe +
        # blockmap) in parallel: both uploads independently see no release
        # for the tag and both try to create one. Confirmed in v2.5.5's
        # actual run logs — two near-simultaneous "creating GitHub release"
        # lines for the same tag, after which the installer's own upload
        # never got confirmed (only the small blockmap made it). Creating
        # the release up front, sequentially, before electron-builder starts
        # uploading anything, removes the race entirely.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo gabelmz/conductor 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --repo gabelmz/conductor `
              --title "$env:GITHUB_REF_NAME" --notes "Automated release for $env:GITHUB_REF_NAME" `
              --target $env:GITHUB_SHA
          }

      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          npm run dist -- --publish always
