name: Release Conductor

on:
  push:
    tags:
      - "v*"
      - "latest"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable backend Python environment
        # A plain `venv` is not portable — its python.exe needs the exact
        # base-interpreter path it was created from to exist on whatever
        # machine runs it. On this runner that path is an ephemeral
        # per-job toolcache directory that is gone once this job ends, so a
        # venv built here could never have worked for anyone downloading the
        # release. scripts/build-portable-python.mjs bundles Python's
        # official self-contained embeddable distribution instead.
        run: node scripts/build-portable-python.mjs .venv-portable

      - name: Install desktop dependencies
        run: |
          cd desktop
          npm ci

      - name: Build and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          npm run dist -- --publish always
